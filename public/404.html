<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so a direct hit or refresh
      // on e.g. /ecommerce-fullstack-frontend/cart 404s here. This encodes
      // the path into a query string and bounces to index.html, which
      // decodes it back before React Router mounts. See
      // https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1 // number of segments in the vite `base` path
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
